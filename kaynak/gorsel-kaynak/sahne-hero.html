<!doctype html>
<meta charset="utf-8">
<title>hazirlaniyor</title>
<style>html,body{margin:0;background:#2a1c12}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
/* europetaxi24 hero sahnesi: gun batimi, sicak tonlar. Tohumlu rastgele: her calistirmada AYNI goruntu.
   Masaustu: 1600x900  |  Mobil: 800x1100 (#mobil) */
const mobil = location.hash === "#mobil";
const W = mobil ? 800 : 1600, H = mobil ? 1100 : 900;
const c = document.getElementById("c"); c.width = W; c.height = H;
const x = c.getContext("2d");
let tohum = 20240917;
const r = () => (tohum = (tohum * 1664525 + 1013904223) >>> 0) / 4294967296;

/* gokyuzu: koyu kahve -> kehribar ufuk */
const ufuk = H * (mobil ? 0.62 : 0.58);
let g = x.createLinearGradient(0, 0, 0, ufuk);
g.addColorStop(0, "#241912"); g.addColorStop(0.55, "#5b3b22"); g.addColorStop(0.88, "#c47a2c"); g.addColorStop(1, "#f3a73c");
x.fillStyle = g; x.fillRect(0, 0, W, ufuk + 2);

/* gun batimi isigi */
g = x.createRadialGradient(W * 0.68, ufuk, 0, W * 0.68, ufuk, W * 0.55);
g.addColorStop(0, "rgba(255,214,128,.85)"); g.addColorStop(0.35, "rgba(247,179,43,.35)"); g.addColorStop(1, "rgba(247,179,43,0)");
x.fillStyle = g; x.fillRect(0, 0, W, ufuk + 2);

/* sehir siluet katmanlari (uzak -> yakin) */
function siluet(taban, ortYuk, renk, adim) {
  x.fillStyle = renk; x.beginPath(); x.moveTo(0, taban);
  for (let px = 0; px < W; px += adim) {
    const h = ortYuk * (0.4 + r() * 1.1);
    x.lineTo(px, taban - h); x.lineTo(px + adim * (0.7 + r() * 0.3), taban - h);
  }
  x.lineTo(W, taban); x.closePath(); x.fill();
}
siluet(ufuk, H * 0.07, "rgba(122,72,30,.55)", W / 28);
siluet(ufuk, H * 0.045, "rgba(70,42,22,.8)", W / 20);
/* pencere isiklari */
for (let i = 0; i < 90; i++) {
  x.fillStyle = "rgba(255,206,110," + (0.25 + r() * 0.5) + ")";
  x.fillRect(r() * W, ufuk - r() * H * 0.1, 3, 4);
}

/* yol: perspektif */
g = x.createLinearGradient(0, ufuk, 0, H);
g.addColorStop(0, "#4a3019"); g.addColorStop(1, "#1a120b");
x.fillStyle = g; x.fillRect(0, ufuk, W, H - ufuk);
/* yol serit cizgileri (kehribar) */
const vx = W * 0.68;
for (const yon of [-1.5, -0.55, 0.55, 1.5]) {
  x.strokeStyle = "rgba(255,196,86,.28)"; x.lineWidth = 3;
  x.setLineDash([26, 40]); x.beginPath(); x.moveTo(vx, ufuk); x.lineTo(vx + yon * W * 0.9, H); x.stroke();
}
x.setLineDash([]);
/* islak asfalt yansimasi: yumusak elips (sert kenar yok) */
x.save(); x.translate(vx, ufuk); x.scale(1, 2.4);
g = x.createRadialGradient(0, 0, 0, 0, 0, W * 0.34);
g.addColorStop(0, "rgba(255,190,90,.55)"); g.addColorStop(0.45, "rgba(243,167,60,.18)"); g.addColorStop(1, "rgba(243,167,60,0)");
x.fillStyle = g; x.beginPath(); x.arc(0, 0, W * 0.34, 0, Math.PI); x.fill(); x.restore();

/* bokeh isiklari (yalnizca isik: dekoratif) */
function bokeh(n, y0, y1, rmin, rmax, renkler) {
  for (let i = 0; i < n; i++) {
    const px = r() * W, py = y0 + r() * (y1 - y0), rr = rmin + r() * (rmax - rmin);
    const col = renkler[Math.floor(r() * renkler.length)];
    const bg = x.createRadialGradient(px, py, 0, px, py, rr);
    bg.addColorStop(0, col + "cc"); bg.addColorStop(0.7, col + "66"); bg.addColorStop(1, col + "00");
    x.fillStyle = bg; x.beginPath(); x.arc(px, py, rr, 0, 7); x.fill();
  }
}
bokeh(34, ufuk - H * 0.1, ufuk + H * 0.2, 14, 46, ["#ffd27a", "#f7b32b", "#ff9a4a", "#ffe9b8"]);
bokeh(14, ufuk + H * 0.1, H, 26, 78, ["#f7b32b", "#ff7a3d", "#ffd27a"]);

/* sol tarafta okunurluk icin yumusak karartma (yazi beyaz) */
g = x.createLinearGradient(0, 0, W * (mobil ? 0.9 : 0.75), 0);
g.addColorStop(0, "rgba(20,13,8,.72)"); g.addColorStop(1, "rgba(20,13,8,0)");
x.fillStyle = g; x.fillRect(0, 0, W, H);
g = x.createLinearGradient(0, H * 0.55, 0, H);
g.addColorStop(0, "rgba(20,13,8,0)"); g.addColorStop(1, "rgba(20,13,8,.55)");
x.fillStyle = g; x.fillRect(0, 0, W, H);

/* hafif tane (bantlanmayi onler) */
const id = x.getImageData(0, 0, W, H), d = id.data;
for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 6; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
x.putImageData(id, 0, 0);
document.title = "hazir";
</script>
