<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Gece Brüksel yolu — hero yer tutucu sahnesi (fotoğraf gelene dek) */
html,body{margin:0;padding:0;background:#0A0A0C;overflow:hidden}
.sahne{position:relative;width:100vw;height:100vh;background:
  radial-gradient(120% 55% at 72% 46%, rgba(229,169,60,.16) 0%, rgba(229,169,60,.05) 38%, transparent 62%),
  radial-gradient(90% 40% at 30% 52%, rgba(120,130,160,.08) 0%, transparent 60%),
  linear-gradient(180deg,#0A0A0C 0%, #0C0C11 44%, #0B0B0F 58%, #08080B 100%);}
/* siluet: uzak sehir */
.siluet{position:absolute;left:0;right:0;top:34%;height:16%;}
.siluet svg{width:100%;height:100%;display:block}
/* yol zemini */
.yol{position:absolute;left:0;right:0;bottom:0;height:44%;
  background:linear-gradient(180deg, rgba(14,14,18,0) 0%, #0C0C10 30%, #0A0A0D 100%);}
/* ışık şeritleri */
.serit{position:absolute;border-radius:999px;filter:blur(5px);transform-origin:left center}
.s1{left:-6%;bottom:26%;width:78%;height:7px;transform:rotate(-6deg);
  background:linear-gradient(90deg,transparent, #E5A93C 30%, #FFC107 55%, rgba(255,224,130,.9) 75%, transparent);
  box-shadow:0 0 34px 7px rgba(255,193,7,.35);}
.s2{left:-10%;bottom:20%;width:64%;height:4px;transform:rotate(-4.5deg);
  background:linear-gradient(90deg,transparent, #C98F2F 35%, #FFC107 70%, transparent);
  box-shadow:0 0 22px 5px rgba(255,193,7,.28);filter:blur(4px)}
.s3{left:-4%;bottom:31%;width:56%;height:2.6px;transform:rotate(-7.5deg);
  background:linear-gradient(90deg,transparent, rgba(255,255,255,.85) 55%, transparent);
  box-shadow:0 0 16px 3px rgba(255,255,255,.22);filter:blur(2.5px)}
.s4{right:-8%;bottom:14%;width:60%;height:5px;transform:rotate(4deg);
  background:linear-gradient(270deg,transparent, #E5A93C 40%, rgba(255,193,7,.85) 70%, transparent);
  box-shadow:0 0 26px 6px rgba(255,193,7,.25);filter:blur(5px)}
.s5{right:-4%;bottom:9%;width:44%;height:2.4px;transform:rotate(3deg);
  background:linear-gradient(270deg,transparent, rgba(255,255,255,.7) 60%, transparent);
  filter:blur(2.5px)}
.s6{left:8%;bottom:6%;width:70%;height:9px;transform:rotate(-2deg);opacity:.32;
  background:linear-gradient(90deg,transparent, #E5A93C 40%, #FFC107 66%, transparent);
  filter:blur(14px)}
/* ıslak asfalt yansıma lekesi */
.yansima{position:absolute;left:18%;bottom:0;width:56%;height:20%;opacity:.5;
  background:radial-gradient(60% 100% at 50% 100%, rgba(255,193,7,.14) 0%, transparent 70%);
  filter:blur(10px)}
/* vinyet */
.vinyet{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(6,6,8,.7) 100%);}
/* mobil kadraj: ışıklar daha aşağıda, glow ortada */
body.mobil .sahne{background:
  radial-gradient(140% 38% at 58% 40%, rgba(229,169,60,.15) 0%, rgba(229,169,60,.04) 40%, transparent 64%),
  linear-gradient(180deg,#0A0A0C 0%, #0C0C11 40%, #0B0B0F 56%, #08080B 100%);}
body.mobil .siluet{top:30%;height:12%}
body.mobil .s1{bottom:34%;width:120%;left:-14%}
body.mobil .s2{bottom:28%;width:110%}
body.mobil .s3{bottom:39%;width:90%}
body.mobil .s4{bottom:20%}
body.mobil .s6{bottom:10%}
</style>
</head>
<body>
<div class="sahne">
  <div class="siluet">
    <svg viewBox="0 0 1600 150" preserveAspectRatio="none">
      <g fill="#0E0E13">
        <rect x="0" y="92" width="90" height="58"/><rect x="70" y="66" width="52" height="84"/>
        <rect x="130" y="98" width="88" height="52"/><rect x="212" y="52" width="40" height="98"/>
        <rect x="238" y="78" width="70" height="72"/><rect x="316" y="102" width="96" height="48"/>
        <rect x="400" y="60" width="34" height="90"/><rect x="428" y="84" width="80" height="66"/>
        <polygon points="530,150 530,70 552,44 574,70 574,150"/>
        <rect x="586" y="92" width="86" height="58"/><rect x="664" y="44" width="36" height="106"/>
        <rect x="694" y="76" width="72" height="74"/><rect x="774" y="100" width="110" height="50"/>
        <rect x="872" y="58" width="44" height="92"/><rect x="908" y="86" width="76" height="64"/>
        <rect x="992" y="104" width="90" height="46"/><rect x="1072" y="66" width="38" height="84"/>
        <rect x="1104" y="90" width="84" height="60"/><rect x="1190" y="48" width="42" height="102"/>
        <rect x="1226" y="80" width="72" height="70"/><rect x="1304" y="98" width="96" height="52"/>
        <rect x="1392" y="64" width="36" height="86"/><rect x="1422" y="88" width="88" height="62"/>
        <rect x="1506" y="102" width="94" height="48"/>
      </g>
      <g fill="rgba(255,193,7,.5)">
        <rect x="222" y="62" width="4" height="4"/><rect x="230" y="72" width="4" height="4"/>
        <rect x="672" y="56" width="4" height="4"/><rect x="680" y="68" width="4" height="4"/>
        <rect x="884" y="70" width="4" height="4"/><rect x="1198" y="60" width="4" height="4"/>
        <rect x="1206" y="72" width="4" height="4"/><rect x="410" y="72" width="4" height="4"/>
        <rect x="1400" y="76" width="4" height="4"/><rect x="556" y="60" width="3.6" height="3.6"/>
      </g>
    </svg>
  </div>
  <div class="yol"></div>
  <div class="yansima"></div>
  <div class="serit s6"></div>
  <div class="serit s1"></div>
  <div class="serit s2"></div>
  <div class="serit s3"></div>
  <div class="serit s4"></div>
  <div class="serit s5"></div>
  <div class="vinyet"></div>
</div>
<script>
if (location.hash === "#mobil") document.body.classList.add("mobil");
</script>
</body>
</html>
