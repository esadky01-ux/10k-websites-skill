<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hero sahnesi: gece sehir bokeh + islak yol</title>
<style>
/* Gece Bruksel atmosferi: sadece isik bokeh'si ve islak asfalt yansimasi.
   Hiz cizgileri BILE BILE burada yok: onlar sitede CSS ile canlanir (site.css .hiz).
   Gercek fotograf gelene dek yer tutucu; ayni dosya adlariyla degistirilebilir. */
html,body{margin:0;padding:0;background:#0A0A0C;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Tohumlu rastgele sayi: her calistirmada AYNI goruntu (tekrar uretilebilir) */
function rng(tohum){
  var s = tohum >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var mobil = location.hash === "#mobil";
var W = mobil ? 800 : 1600, H = mobil ? 1100 : 900;
var cv = document.getElementById("c");
cv.width = W; cv.height = H;
var g = cv.getContext("2d");
var r = rng(mobil ? 7 : 11);

/* renk paleti: altin agirlikli, sicak beyaz, kehribar, soluk mavi, nadir kirmizi */
var PALET = [
  [255,193,7],[255,193,7],[255,193,7],[255,204,64],[229,169,60],[229,169,60],
  [255,236,190],[255,236,190],[255,255,255],[150,175,230],[255,110,90]
];
function renk(a){ var p = PALET[Math.floor(r()*PALET.length)]; return "rgba("+p[0]+","+p[1]+","+p[2]+","+a+")"; }
function renkDizisi(p, a){ return "rgba("+p[0]+","+p[1]+","+p[2]+","+a+")"; }

/* ufuk cizgisi: masaustunde %56, mobilde %50 */
var UFUK = H * (mobil ? 0.50 : 0.56);

/* 1) zemin: dikey koyu gecis */
var zemin = g.createLinearGradient(0,0,0,H);
zemin.addColorStop(0,   "#08080A");
zemin.addColorStop(0.38,"#0B0B10");
zemin.addColorStop(mobil ? 0.50 : 0.56, "#15110B");
zemin.addColorStop(mobil ? 0.56 : 0.62, "#0B0A0C");
zemin.addColorStop(1,   "#070709");
g.fillStyle = zemin; g.fillRect(0,0,W,H);

/* 2) ufuk sicak parlamasi (sag-orta: kartin arkasi) */
function parlama(cx, cy, rx, ry, a){
  g.save();
  g.translate(cx, cy); g.scale(1, ry/rx);
  var gr = g.createRadialGradient(0,0,0,0,0,rx);
  gr.addColorStop(0, "rgba(255,193,7,"+a+")");
  gr.addColorStop(0.45, "rgba(229,169,60,"+(a*0.35)+")");
  gr.addColorStop(1, "rgba(229,169,60,0)");
  g.fillStyle = gr;
  g.fillRect(-rx, -rx, rx*2, rx*2);
  g.restore();
}
parlama(W*0.68, UFUK, W*0.55, H*0.20, 0.20);
parlama(W*0.30, UFUK+H*0.02, W*0.42, H*0.12, 0.09);

/* 3) uzak sehir bokeh'si: kucuk, keskin kenarli halkali daireler */
function bokeh(x, y, yaricap, a, bulanik, halka){
  g.save();
  g.filter = "blur("+bulanik+"px)";
  var c = renk(1);
  var pal = PALET[Math.floor(r()*PALET.length)];
  var gr = g.createRadialGradient(x,y,0,x,y,yaricap);
  gr.addColorStop(0,    renkDizisi(pal, a*0.55));
  gr.addColorStop(0.72, renkDizisi(pal, a*0.75));
  gr.addColorStop(0.9,  renkDizisi(pal, halka ? a : a*0.6));
  gr.addColorStop(1,    renkDizisi(pal, 0));
  g.fillStyle = gr;
  g.beginPath(); g.arc(x,y,yaricap,0,Math.PI*2); g.fill();
  g.restore();
  return pal;
}

var yansimalar = [];
var uzak = mobil ? 90 : 170;
for (var i = 0; i < uzak; i++){
  /* yatayda hafif kume: sag-orta daha yogun */
  var x = (mobil ? r() : Math.pow(r(), 0.85)) * W;
  var y = UFUK + (r()+r()+r()-1.5) * H * 0.075 - H*0.02;
  var yr = 2.2 + Math.pow(r(), 2.2) * (mobil ? 10 : 12);
  var a = 0.22 + r()*0.55;
  var pal = bokeh(x, y, yr, a, 0.8 + r()*1.4, true);
  if (yr > 4.5 && r() < 0.32) yansimalar.push({x:x, y:y, r:yr, a:a, pal:pal});
}

/* 4) orta mesafe: daha buyuk, daha sonuk */
var orta = mobil ? 16 : 30;
for (var j = 0; j < orta; j++){
  var x2 = r() * W;
  var y2 = UFUK + (r()-0.55) * H * 0.26;
  bokeh(x2, y2, 14 + r()*20, 0.10 + r()*0.18, 2 + r()*2, true);
}

/* 5) on plan: cok buyuk, cok soluk (kenarlarda) */
var on = [
  [W*0.93, H*0.20, 90], [W*0.06, H*0.72, 110], [W*0.82, H*0.78, 70],
  [W*0.44, H*0.12, 60], [W*0.02, H*0.30, 80]
];
on.forEach(function(o){ bokeh(o[0], o[1], o[2], 0.07 + r()*0.05, 7, false); });

/* 6) islak yol: alt bolge koyulasir, isiklar dikey yansir */
var yol = g.createLinearGradient(0, UFUK + H*0.05, 0, H);
yol.addColorStop(0, "rgba(8,8,10,0)");
yol.addColorStop(0.35, "rgba(8,8,10,.55)");
yol.addColorStop(1, "rgba(6,6,8,.85)");
g.fillStyle = yol; g.fillRect(0, UFUK + H*0.05, W, H);

yansimalar.forEach(function(o){
  var boy = 50 + r() * (mobil ? 150 : 170);
  var en = o.r * (2.0 + r()*1.6);
  g.save();
  g.filter = "blur(" + (7 + r()*8) + "px)";
  var gr = g.createLinearGradient(0, o.y + o.r, 0, o.y + o.r + boy);
  gr.addColorStop(0, renkDizisi(o.pal, o.a * 0.30));
  gr.addColorStop(1, renkDizisi(o.pal, 0));
  g.fillStyle = gr;
  g.fillRect(o.x - en/2, o.y + o.r, en, boy);
  g.restore();
});

/* asfaltta genis, cok soluk sicak leke */
parlama(W*0.62, UFUK + H*0.20, W*0.36, H*0.10, 0.07);

/* 7) vinyet: kenarlar kararir, metin okunakli kalir */
var vin = g.createRadialGradient(W*0.55, H*0.45, Math.min(W,H)*0.28, W*0.5, H*0.5, Math.max(W,H)*0.78);
vin.addColorStop(0, "rgba(6,6,8,0)");
vin.addColorStop(1, "rgba(6,6,8,.80)");
g.fillStyle = vin; g.fillRect(0,0,W,H);

/* 8) ince gurultu: JPEG'de bant olusmasini onler */
var img = g.getImageData(0,0,W,H), d = img.data;
var n = rng(99);
for (var k = 0; k < d.length; k += 4){
  var v = (n() - 0.5) * 3.2;
  d[k] += v; d[k+1] += v; d[k+2] += v;
}
g.putImageData(img, 0, 0);
document.title = "hazir";
</script>
</body>
</html>
