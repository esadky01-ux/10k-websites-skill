<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&display=swap">
<style>
/* OG karti 1200x630 — yuklenen logo kompozisyonunun yeniden cizimi */
html,body{margin:0;padding:0;background:#0A0A0C;width:1200px;height:630px;overflow:hidden;
  font-family:'Archivo',Arial,sans-serif}
.kart{position:relative;width:1200px;height:630px;display:flex;align-items:center;justify-content:center;gap:56px;
  background:
    radial-gradient(90% 70% at 78% 30%, rgba(229,169,60,.10) 0%, transparent 60%),
    linear-gradient(180deg,#0A0A0C 0%, #0B0B0F 100%);}
.isik{position:absolute;border-radius:999px;filter:blur(6px)}
.i1{left:-6%;bottom:17%;width:70%;height:7px;transform:rotate(-7deg);
  background:linear-gradient(90deg,transparent,#E5A93C 35%,#FFC107 60%,transparent);
  box-shadow:0 0 30px 7px rgba(255,193,7,.3)}
.i2{left:-8%;bottom:10%;width:52%;height:3px;transform:rotate(-5deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75) 55%,transparent);filter:blur(3px)}
.i3{right:-8%;top:14%;width:48%;height:4px;transform:rotate(5deg);opacity:.6;
  background:linear-gradient(270deg,transparent,#E5A93C 50%,transparent);filter:blur(5px)}
.ikon{flex:none}
.cizgi{width:3px;height:300px;background:#E5A93C;opacity:.85}
.yazi .marka{font-size:96px;font-weight:900;letter-spacing:2px;line-height:1}
.yazi .marka b{color:#fff;font-weight:900}.yazi .marka span{color:#FFC107}
.yazi .slogan{margin-top:26px;font-size:29px;font-weight:700;letter-spacing:11px;color:#fff}
.yazi .alt-cizgi{margin-top:22px;width:560px;height:3px;background:#E5A93C;opacity:.7}
</style>
</head>
<body>
<div class="kart">
  <div class="isik i1"></div><div class="isik i2"></div><div class="isik i3"></div>
  <svg class="ikon" width="240" height="185" viewBox="0 0 142 113" fill="none">
    <rect x="0" y="52" width="15" height="15" fill="#FFC107"/><rect x="15" y="67" width="15" height="15" fill="#FFC107"/>
    <rect x="127" y="52" width="15" height="15" fill="#FFC107"/><rect x="112" y="67" width="15" height="15" fill="#FFC107"/>
    <path d="M37 50 L45 20 Q47 12 55 12 L87 12 Q95 12 97 20 L105 50 Q112 54 112 63 L112 95 Q112 101 106 101 L98 101 Q92 101 92 95 L92 88 L50 88 L50 95 Q50 101 44 101 L36 101 Q30 101 30 95 L30 63 Q30 54 37 50 Z" stroke="#FFC107" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <rect x="47" y="18" width="48" height="20" rx="4" fill="#FFC107"/>
    <text x="71" y="33.5" text-anchor="middle" font-family="Archivo,Arial,sans-serif" font-size="15" font-weight="900" fill="#0A0A0C">TAXI</text>
    <path d="M42 62 Q50 58 58 62.5 L58 70 Q50 72 42 70 Z" fill="#FFC107"/>
    <path d="M100 62 Q92 58 84 62.5 L84 70 Q92 72 100 70 Z" fill="#FFC107"/>
    <rect x="59" y="77" width="24" height="5" rx="2.5" fill="#FFC107"/>
  </svg>
  <div class="cizgi"></div>
  <div class="yazi">
    <div class="marka"><b>EUROPA</b><span>TAXI</span></div>
    <div class="slogan">YOUR RIDE, OUR PRIORITY</div>
    <div class="alt-cizgi"></div>
  </div>
</div>
</body>
</html>
